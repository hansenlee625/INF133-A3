<!--TODO: bind href to the appropriate local URL for the album/artist/song.-->
<a [routerLink]="{
  artist:['/artist', resource.id],
  album:['/album', resource.id],
  track:['/track', resource.id]
}[resource.category]">
	<!--TODO bind src with the album/artist/song image URL-->
	<img class="d-block w-100" [src]="resource.imageURL" [alt]="resource.name">
	<div class="carousel-caption d-none d-md-block">
		<!--TODO: populate h5 with the album/artist/song name-->
		<h5>{{resource.name}}</h5>
	</div>
</a>
